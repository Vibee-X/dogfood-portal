{% extends "base.html" %}
{% block title %}Judge Progress — {{ event.name }}{% endblock %}
{% block content %}
<div class="mt-3">
    <a href="{% url 'events:event_detail' slug=event.slug %}" class="text-muted">&larr; {{ event.name }}</a>
    <h1 class="mt-1">Judge Progress</h1>
    <p class="text-muted">Refreshes every 10 seconds while this page is open.</p>
    <div id="judge-progress" hx-get="{% url 'judging_web:progress_dashboard' slug=event.slug %}" hx-trigger="load, every 10s" hx-swap="innerHTML">
        {% include "judging/progress_table.html" %}
    </div>
</div>
{% endblock %}
