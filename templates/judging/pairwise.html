{% extends "base.html" %}
{% block title %}Pairwise Judging — {{ event.name }}{% endblock %}
{% block content %}
<div class="mt-3">
    <a href="{% url 'events:event_detail' slug=event.slug %}" class="text-muted">&larr; {{ event.name }}</a>
    <h1 class="mt-1">Pairwise Judging</h1>
    <p class="text-muted">Choose the stronger project in each assigned comparison. Decisions are final.</p>
    <div id="pairwise-comparison" class="mt-2">
        {% include "judging/pairwise_content.html" %}
    </div>
</div>
{% endblock %}
