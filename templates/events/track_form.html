{% extends "base.html" %}
{% block title %}Add Track — Dogfood Portal{% endblock %}
{% block content %}
<div class="auth-container" style="max-width: 640px;">
    <div class="card">
        <h1>Add Track to {{ event.name }}</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Add Track</button>
        </form>
    </div>
</div>
{% endblock %}
