services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      SECRET_KEY: "dev-secret-key-change-in-production"
      DATABASE_URL: "postgres://dogfood:dogfood@db:5432/dogfood"
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles

volumes:
  pgdata:
  static_files:
